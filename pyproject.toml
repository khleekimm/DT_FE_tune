[project]
name = "fetune"
version = "1.0.0"
description = "Reciprocal second-order identification of measured complex frequency responses"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=2",
  "scipy>=1.14",
  "h5py>=3.11",
  "matplotlib>=3.9",
  "pillow>=10",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
